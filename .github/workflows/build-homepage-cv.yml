name: Build homepage CV PDFs

on:
  push:
    paths:
      - '.github/workflows/build-homepage-cv.yml'
      - '.github/cv/source/*.tex'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct latest CV sources and assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/cv/build

          # Use editable LaTeX sources after first successful rebuild.
          if [[ -s .github/cv/source/resume_CN.tex && -s .github/cv/source/resume_EN.tex ]]; then
            cp .github/cv/source/resume_CN.tex .github/cv/build/resume_CN.tex
            cp .github/cv/source/resume_EN.tex .github/cv/build/resume_EN.tex
          else
            cat .github/cv/chunks/cn_* | base64 -d | gzip -dc > .github/cv/build/resume_CN.tex
            cat .github/cv/chunks/en_* | base64 -d | gzip -dc > .github/cv/build/resume_EN.tex
          fi
          base64 -d < .github/cv/resume.cls.gz.b64 | gzip -dc > .github/cv/build/resume.cls
          base64 -d < .github/cv/zh_CN_fonts.sty.gz.b64 | gzip -dc > .github/cv/build/zh_CN_fonts.sty
          base64 -d < .github/cv/linespacing_fix.sty.gz.b64 | gzip -dc > .github/cv/build/linespacing_fix.sty

          python - <<'PY'
          from pathlib import Path
          import re

          def close_ubiquant_internship(tex, employer):
              """Change only Ubiquant's internship end date, not ongoing positions."""
              start = tex.find(employer)
              assert start != -1, f'Cannot find employer: {employer}'
              end = tex.find(r'\datedsubsection', start + len(employer))
              assert end != -1, f'Cannot locate end of Ubiquant section: {employer}'
              section = tex[start:end]
              if '2026.10' in section:
                  return tex
              dates = list(re.finditer(r'(2026\.5.{0,80}?)(至今|Present)', section, flags=re.S))
              assert len(dates) == 1, f'Expected one ongoing 2026.5 Ubiquant date ({employer}); got {len(dates)}'
              match = dates[0]
              section = section[:match.start(2)] + '2026.10' + section[match.end(2):]
              if employer == 'Ubiquant':
                  section = section.replace('Working on', 'Worked on', 1)
              assert re.search(r'2026\.5.{0,80}?2026\.10', section, flags=re.S), 'Incorrect Ubiquant end date'
              return tex[:start] + section + tex[end:]


          cn = Path('.github/cv/build/resume_CN.tex')
          s = cn.read_text(encoding='utf-8')
          chosen = r'\href{https://ydchen0806.github.io/docs/cast_ccf_2026_selection_proof.png}{入选中国科协博士生青托（2026，CCF培育）}'
          if chosen not in s:
              old = [
                  '获中国科学技术大学推荐申报中国科协青年科技人才培育工程博士生专项计划（2026年）',
                  '中国科协青年科技人才培育工程博士生专项计划推荐人选（2026年）',
                  '中科大推荐博士生青托（2026）',
              ]
              matched = [x for x in old if x in s]
              assert len(matched) == 1, 'CN: cannot find original nomination; excerpt=' + repr(s[max(0,s.find('荣誉奖励')-30):s.find('荣誉奖励')+500])
              s = s.replace(matched[0], chosen)
          s = s.replace('国家自然科学基金青年学生基础研究项目（博士研究生）负责人（2024年）',
                        '国家自然科学基金博士生项目负责人（2024）', 1)
          if '2028' in s:
              for old, new in [('2028.7','2027.6'), ('2028.07','2027.06'), ('2028','2027')]:
                  if old in s:
                      s = s.replace(old,new,1)
                      break
          assert '2028' not in s and '2027' in s, 'CN graduation date not 2027'
          if 'Accepted, 2025' in s:
              s = s.replace('Accepted, 2025', 'Accepted, Oct. 2026', 1)
          assert 'Accepted, Oct. 2026' in s, 'CN TPAMI acceptance date mismatch'
          s = close_ubiquant_internship(s, '九坤投资')
          assert chosen in s, 'CN selection not updated'
          # Also update the separate Honors section (not only PhD education).
          s = s.replace('获中国科学技术大学推荐申报中国科协青年科技人才培育工程博士生专项计划',
                        '入选中国科协博士生青托（CCF培育）')
          s = s.replace('中国科学技术大学信息学院推荐人选',
                        '培育学会：中国计算机学会（CCF）')
          s = s.replace(r'\textbf{2026.09}', r'\textbf{2026.10}', 1)
          assert '获中国科学技术大学推荐申报中国科协' not in s, 'CN old nomination remains; excerpt=' + repr(s[max(0,s.find('获中国科学技术大学推荐')-110):s.find('获中国科学技术大学推荐')+430])
          cn.write_text(s, encoding='utf-8')

          en = Path('.github/cv/build/resume_EN.tex')
          s = en.read_text(encoding='utf-8')
          chosen = r'\href{https://ydchen0806.github.io/docs/cast_ccf_2026_selection_proof.png}{Selected for the 2026 CAST Doctoral Student Program (CCF)}'
          if chosen not in s:
              old = [
                  'Recommended by USTC for the 2026 CAST Young Science and Technology Talent Cultivation Program (Doctoral Student Track)',
                  'Recommended Candidate, 2026 CAST Young Science and Technology Talent Cultivation Program (Doctoral Student Track)',
                  'USTC Nominee, CAST Doctoral Student Talent Program (2026)',
              ]
              matched = [x for x in old if x in s]
              assert len(matched) == 1, 'EN: cannot find original nomination; excerpt=' + repr(s[max(0,s.find('Honors')-30):s.find('Honors')+500])
              s = s.replace(matched[0], chosen)
          s = s.replace('Principal Investigator, NSFC Young Students Basic Research Program (Doctoral Student) (2024)',
                        'NSFC Doctoral Student Project PI (2024)', 1)
          if '2028' in s:
              for old, new in [('2028.7','2027.6'), ('2028.07','2027.06'), ('July 2028','June 2027'), ('2028','2027')]:
                  if old in s:
                      s = s.replace(old,new,1)
                      break
          assert '2028' not in s and '2027' in s, 'EN graduation date not 2027'
          if 'Accepted, 2025' in s:
              s = s.replace('Accepted, 2025', 'Accepted, Oct. 2026', 1)
          assert 'Accepted, Oct. 2026' in s, 'EN TPAMI acceptance date mismatch'
          s = close_ubiquant_internship(s, 'Ubiquant')
          assert chosen in s, 'EN selection not updated'
          # Also update the separate Honors section (not only PhD education).
          s = s.replace('Recommended by USTC for the 2026 CAST Young Science and Technology Talent Cultivation Program (Doctoral Student Track)',
                        'Selected for the 2026 CAST Doctoral Student Program (CCF)')
          s = s.replace('Recommended by USTC School of Information Science and Technology',
                        'Cultivating society: China Computer Federation (CCF)')
          s = s.replace(r'\textbf{2026.09}', r'\textbf{2026.10}', 1)
          assert 'Recommended by USTC' not in s, 'EN old nomination remains'
          en.write_text(s, encoding='utf-8')
          PY

          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils imagemagick
          rm -f /tmp/cvimg-*
          pdfimages -all docs/cyd_resume_CN.pdf /tmp/cvimg

          qr=''
          photo=''
          for f in /tmp/cvimg-*; do
            [ -f "$f" ] || continue
            dims=$(identify -format '%w %h' "$f" 2>/dev/null || true)
            [ -n "$dims" ] || continue
            read -r w h <<< "$dims"
            diff=$(( w > h ? w-h : h-w ))
            if [ "$diff" -le 30 ] && [ "$w" -ge 300 ]; then
              qr="$f"
            fi
            if [ "$h" -gt "$w" ] && [ "$h" -ge 600 ]; then
              photo="$f"
            fi
          done

          test -n "$qr" || { echo 'Could not recover QR image from existing CV'; exit 1; }
          test -n "$photo" || { echo 'Could not recover portrait from existing CV'; exit 1; }
          cp "$qr" .github/cv/build/cydQRcode.jpeg
          cp "$photo" .github/cv/build/cyd.jpg

          echo 'Reconstructed source files:'
          wc -c .github/cv/build/resume_CN.tex .github/cv/build/resume_EN.tex
          identify .github/cv/build/cydQRcode.jpeg .github/cv/build/cyd.jpg

      - name: Compile Chinese and English CVs with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            resume_CN.tex
            resume_EN.tex
          working_directory: .github/cv/build
          latexmk_use_xelatex: true

      - name: Validate and install homepage PDFs
        shell: bash
        run: |
          set -euo pipefail
          test -s .github/cv/build/resume_CN.pdf
          test -s .github/cv/build/resume_EN.pdf
          pdfinfo .github/cv/build/resume_CN.pdf | grep '^Pages:'
          pdfinfo .github/cv/build/resume_EN.pdf | grep '^Pages:'
          cp .github/cv/build/resume_CN.pdf docs/cyd_resume_CN.pdf
          cp .github/cv/build/resume_EN.pdf docs/CYD_resume_EN.pdf
          pdftotext -layout docs/cyd_resume_CN.pdf /tmp/cv_CN.txt
          pdftotext -layout docs/CYD_resume_EN.pdf /tmp/cv_EN.txt
          head -n 30 /tmp/cv_CN.txt | grep -q '博士生青托' || { echo 'ERROR: CN PDF missing selected program'; exit 1; }
          head -n 30 /tmp/cv_CN.txt | grep -q 'CCF' || { echo 'ERROR: CN PDF missing CCF'; exit 1; }
          head -n 30 /tmp/cv_EN.txt | grep -q 'CAST Doctoral Student Program' || { echo 'ERROR: EN PDF missing selected program'; exit 1; }
          head -n 30 /tmp/cv_EN.txt | grep -q 'CCF' || { echo 'ERROR: EN PDF missing CCF'; exit 1; }
          ! grep -q '获中国科学技术大学推荐' /tmp/cv_CN.txt || { echo 'ERROR: stale CN nomination'; exit 1; }
          ! grep -q 'Recommended by USTC' /tmp/cv_EN.txt || { echo 'ERROR: stale EN nomination'; exit 1; }
          mkdir -p .github/cv/source
          cp .github/cv/build/resume_CN.tex .github/cv/source/resume_CN.tex
          cp .github/cv/build/resume_EN.tex .github/cv/source/resume_EN.tex

      - name: Commit updated PDFs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/cyd_resume_CN.pdf docs/CYD_resume_EN.pdf
          git add -f .github/cv/source/resume_CN.tex .github/cv/source/resume_EN.tex
          if git diff --cached --quiet; then
            echo 'CV PDFs are already up to date.'
          else
            git commit -m 'Update 2026 CAST CCF selection in bilingual CV and LaTeX sources'
            git push origin HEAD:main
          fi

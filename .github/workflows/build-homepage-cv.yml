name: Build homepage CV PDFs

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/build-homepage-cv.yml'
      - '.github/cv/source/*.tex'
      - '.github/cv/*.gz.b64'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: homepage-cv-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-cv:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare authoritative sources and project assets
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import gzip
          import shutil
          import zipfile
          from pathlib import Path

          build = Path('.github/cv/build')
          build.mkdir(parents=True, exist_ok=True)
          for name in ('resume_CN.tex', 'resume_EN.tex'):
              source = Path('.github/cv/source') / name
              assert source.is_file() and source.stat().st_size, f'Missing source: {source}'
              shutil.copyfile(source, build / name)

          for name in ('resume.cls', 'zh_CN_fonts.sty', 'linespacing_fix.sty'):
              packed = Path('.github/cv') / (name + '.gz.b64')
              (build / name).write_bytes(gzip.decompress(base64.b64decode(packed.read_bytes())))

          # Recover original assets independently of the previous PDF layout.
          with zipfile.ZipFile('docs/Yinda_Chen_CV_Overleaf_Source.zip') as archive:
              for name in ('cyd.jpg', 'cydQRcode.jpeg'):
                  data = archive.read(name)
                  assert data, f'Empty asset: {name}'
                  (build / name).write_bytes(data)
          shutil.copyfile('docs/cast_ccf_2026_selection_proof.png',
                          build / 'cast_ccf_2026_selection_proof.png')
          (build / 'main.tex').write_text(
              '% !TeX program = xelatex\n'
              '% Chinese by default; change the input below to resume_EN.tex for English.\n'
              '\\input{resume_CN.tex}\n', encoding='utf-8')
          (build / 'latexmkrc').write_text('$pdf_mode = 5;\n', encoding='utf-8')

          # Editable sources are authoritative. Never rewrite CV content during builds.
          for name in ('resume_CN.tex', 'resume_EN.tex'):
              assert (build / name).read_bytes() == (Path('.github/cv/source') / name).read_bytes()
          print('Prepared both CV sources, local style dependencies, and original images.')
          PY

      - name: Compile Chinese and English CVs with XeLaTeX
        uses: xu-cheng/latex-action@v4
        with:
          root_file: |
            main.tex
            resume_CN.tex
            resume_EN.tex
          working_directory: .github/cv/build
          latexmk_use_xelatex: true

      - name: Validate and install homepage PDFs
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq poppler-utils
          for lang in CN EN; do
            pdf=".github/cv/build/resume_${lang}.pdf"
            test -s "$pdf"
            pdfinfo "$pdf"
            pdftotext -layout "$pdf" "/tmp/resume_${lang}.txt"
            test "$(wc -m < "/tmp/resume_${lang}.txt")" -gt 1000
            cmp ".github/cv/source/resume_${lang}.tex" ".github/cv/build/resume_${lang}.tex"
          done
          cp .github/cv/build/resume_CN.pdf docs/cyd_resume_CN.pdf
          cp .github/cv/build/resume_EN.pdf docs/CYD_resume_EN.pdf

      - name: Create Overleaf-ready source ZIP
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/cv/build/README.md <<'EOF'
          # Yinda Chen | Bilingual Academic CV

          A self-contained LaTeX project with Chinese and English academic CVs.

          ## Compile on Overleaf

          1. Select New Project > Upload Project and upload this ZIP.
          2. Set the main document to main.tex (Chinese by default).
          3. Select XeLaTeX as the compiler.
          4. Click Recompile.

          For English, set the main document to resume_EN.tex, or change main.tex to:
          ~~~tex
          \input{resume_EN.tex}
          ~~~

          For Chinese, select resume_CN.tex, or use:
          ~~~tex
          \input{resume_CN.tex}
          ~~~

          ## Compile locally

          With a current TeX Live installation:
          ~~~bash
          latexmk -xelatex -interaction=nonstopmode -halt-on-error resume_CN.tex
          latexmk -xelatex -interaction=nonstopmode -halt-on-error resume_EN.tex
          ~~~

          ## Editable sources and assets

          - resume_CN.tex and resume_EN.tex: authoritative CV content and formatting.
          - resume.cls, zh_CN_fonts.sty, linespacing_fix.sty: local template dependencies.
          - cyd.jpg and cydQRcode.jpeg: original portrait and contact QR image.
          - main.tex and latexmkrc: compiler entrypoint and configuration.
          - cast_ccf_2026_selection_proof.png: supporting award document; not required for typesetting.

          The GitHub workflow compiles these sources without rewriting their content.
          PDF hyperlinks point to the public homepage and original research resources.
          EOF
          python - <<'PY'
          from pathlib import Path
          import zipfile

          build = Path('.github/cv/build')
          target = Path('docs/Yinda_Chen_CV_Overleaf_Source.zip')
          names = (
              'main.tex', 'latexmkrc', 'README.md', 'resume_CN.tex', 'resume_EN.tex',
              'resume.cls', 'zh_CN_fonts.sty', 'linespacing_fix.sty',
              'cyd.jpg', 'cydQRcode.jpeg', 'cast_ccf_2026_selection_proof.png',
          )
          with zipfile.ZipFile(target, 'w', zipfile.ZIP_DEFLATED, compresslevel=9) as archive:
              for name in names:
                  assert (build / name).stat().st_size, f'Empty file: {name}'
                  archive.write(build / name, arcname=name)
          with zipfile.ZipFile(target) as archive:
              assert archive.testzip() is None
              assert set(archive.namelist()) == set(names)
              for name in ('resume_CN.tex', 'resume_EN.tex'):
                  assert archive.read(name) == (Path('.github/cv/source') / name).read_bytes()
          print(f'Overleaf source ZIP ready: {target} ({target.stat().st_size:,} bytes)')
          PY

      - name: Commit compiled PDFs and source archive
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/cyd_resume_CN.pdf docs/CYD_resume_EN.pdf
          git add -f docs/Yinda_Chen_CV_Overleaf_Source.zip
          if git diff --cached --quiet; then
            echo 'CV PDFs and source archive are already up to date.'
          else
            git commit -m 'Build revised bilingual academic CVs and Overleaf source archive'
            git push origin HEAD:main
          fi

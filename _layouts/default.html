---
layout: compress
---

<!doctype html>
<html lang="en" class="no-js">
  <head>
    {% include head.html %}
    {% include head/custom.html %}
  </head>
  <body>
    {% include browser-upgrade.html %}
    {% include masthead.html %}

    <div id="main" role="main">
      {% include sidebar.html %}
      <article class="page" itemscope itemtype="https://schema.org/CreativeWork">
        {% if page.title %}
        <meta itemprop="headline" content="{{ page.title | markdownify | strip_html | strip_newlines | escape_once }}">
        {% endif %}
        <div class="page__inner-wrap">
          <section class="page__content" itemprop="text">
            {{ content }}
          </section>
        </div>
      </article>
    </div>

    <footer class="site-footer">
      Yinda Chen · Updated {{ site.time | date: "%B %Y" }}
    </footer>

    <button id="backToTop" aria-label="Back to top" hidden>↑</button>
    <script>
    (function () {
      var button = document.getElementById('backToTop');
      function updateVisibility() { button.hidden = window.scrollY <= 400; }
      window.addEventListener('scroll', updateVisibility, { passive: true });
      updateVisibility();
      button.addEventListener('click', function () {
        var reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.scrollTo({ top: 0, behavior: reduceMotion ? 'auto' : 'smooth' });
      });
    })();
    </script>
    {% include scripts.html %}
  </body>
</html>
